#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tableaunoir"
name = "Tableaunoir"
description.en = "Online blackboard with magnets for teaching and making animations and presentations"
description.fr = "Tableau noir en ligne avec aimants pour enseigner, créer des animations et des présentations"

version = "2026.11.20~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-3.0"
website = "https://tableaunoir.github.io/"
demo = "https://tableaunoir.github.io/"
code = "https://github.com/tableaunoir/tableaunoir"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/tableaunoir"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/tableaunoir/tableaunoir/archive/3a0ea65b63e9abc890b43347fc5029f35e3a941e.tar.gz"
    sha256 = "130cef953456ff562b23ed8960be524aac6469cb0f76146a60d30ca739834429"
    prefetch = false

    autoupdate.strategy = "latest_github_commit"

    [resources.sources.prebuilt]
    url = "https://github.com/tableaunoir/tableaunoir.github.io/archive/f91a69a22e737dfd1f65d80e979b488665bf798b.tar.gz"
    sha256 = "886e554c7557b295bbe82a8b780411f93bba322f6e87f23e761af70ddbb5f9c8"

    autoupdate.strategy = "latest_github_commit"
    autoupdate.upstream = "https://github.com/tableaunoir/tableaunoir.github.io"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.permissions]
    main.url = "/"
